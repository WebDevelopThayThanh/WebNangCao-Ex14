<div *ngFor="let c of categories" style="margin-bottom: 30px;">
  <h3 style="color: blue; background: #e0e0e0; padding: 8px;">
    Danh mục: {{ c.CateName }} (Mã: {{ c.CateId }})
  </h3>
  <table border="1" cellpadding="8" style="border-collapse: collapse; width: 100%;">
    <tr style="background-color: #f2f2f2;">
      <th>Product ID</th>
      <th>Product Name</th>
      <th>Price</th>
      <th>Picture</th>
    </tr>
    <tr *ngFor="let p of c.Products">
      <td>{{ p.ProductId }}</td>
      <td>{{ p.ProductName }}</td>
      <td>{{ p.Price }}</td>
      <td>
        <img [src]="p.Image" width="70" height="70" />
      </td>
    </tr>
  </table>
</div>
